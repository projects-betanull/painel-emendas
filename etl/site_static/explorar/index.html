<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorar emendas parlamentares</title>
<meta name="description" content="Cruze e filtre as emendas parlamentares por ano, estado, município, parlamentar, tipo e área.">
<link rel="stylesheet" href="../estilo.css">
</head>
<body>
<header class="topo"><a href="../" class="marca">Emendas<span>.</span></a>
<span class="sub">explorador: filtre, cruze e aprofunde</span></header>
<main class="largo">
<h1>Explorar <a class="troca" id="irPainel" href="../painel/">Ver no painel ›</a></h1>
<div class="controles">
  <label>Linhas <select id="linhas"></select></label>
  <label>Colunas <select id="colunas"></select></label>
  <label>Medida <select id="medida"><option value="valor">Valor recebido</option><option value="n">Nº de pagamentos</option></select></label>
</div>
<nav id="trilha" class="trilha" aria-label="Filtros aplicados"></nav>
<section id="bancada" class="cartao bancada" hidden></section>
<details id="facetas" class="facetas"><summary>Filtros</summary><div id="listas"></div></details>
<p id="resumo" class="resumo">Carregando dados…</p>
<div class="tabela"><table id="pivo"></table></div>
<p id="mais" class="dica"></p>
</main>
<footer><p>Clique numa linha para aprofundar (drill-down). Clique num filtro acima da tabela para voltar (drill-up). O link da página guarda a sua consulta.</p></footer>
<script src="../motor.js"></script>
<script src="explorar.js"></script>
</body>
</html>
