name: Prévia de um branch (Cloudflare Pages, sem tocar a produção)

# Push num branch previa-* gera o site com dados reais e publica como prévia em
# https://<branch>.painel-emendas.pages.dev (a produção, branch main, não muda).
on:
  push:
    branches: ["previa-*"]

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Vazio enquanto o segredo não for criado; o passo de publicação é pulado.
      # Vazio enquanto o segredo não for criado; a publicação do site é pulada.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Primeiro ano carregado; o ETL usa tudo o que o Portal tiver a partir daqui.
      ANO_INICIAL: "2000"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Códigos de verificação do Google Search Console e do Bing (Settings → Variables → Actions). Vazios = sem a tag.
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Base de contratos do PNCP (feita pelo workflow pncp.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pncp-dados -p contratos.parquet -D data/pncp || echo "sem base do PNCP; páginas buscam pelo navegador"

      - name: Rodar ETL
        run: python -m etl.build

      - name: Guardar relatório de qualidade
        uses: actions/upload-artifact@v4
        with:
          name: qualidade
          path: data/out/qualidade.json

      - name: Publicar prévia no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 pages deploy site --project-name=painel-emendas --branch="$GITHUB_REF_NAME" --commit-dirty=true
