name: Sondar fontes novas
on: { workflow_dispatch: {} }
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Portal da Transparência (convênios, CEPIM) pela data publicada na página
        continue-on-error: true
        run: |
          set +e
          for o in convenios cepim; do
            P=$(curl -sL -m 60 -A "Mozilla/5.0" "https://portaldatransparencia.gov.br/download-de-dados/$o")
            echo "$P" | grep -oE 'arquivos.push\(\{[^}]*\}' | tail -3
            D=$(echo "$P" | grep -oE '"ano" : "[0-9]{4}", "mes" : "[0-9]{2}", "dia" : "[0-9]{2}"' | tail -1 | grep -oE '[0-9]+' | tr -d '\n')
            echo "$o -> $D"
            curl -sL -m 600 -A "Mozilla/5.0" "https://portaldatransparencia.gov.br/download-de-dados/$o/$D" -o x.zip -w "HTTP %{http_code} %{content_type} %{size_download}\n"
            unzip -l x.zip; for f in $(unzip -Z1 x.zip); do echo "== $f"; unzip -p x.zip "$f" | head -3 | iconv -f latin1 -t utf8; unzip -p x.zip "$f" | wc -l; done
            if [ $o = convenios ]; then f=$(unzip -Z1 x.zip | head -1); unzip -p x.zip "$f" | iconv -f latin1 -t utf8 | awk -F';' 'NR>1{print $20}' | sort | uniq -c | sort -rn | head -15; fi
          done
