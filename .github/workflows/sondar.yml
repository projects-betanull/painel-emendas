name: Sondar fontes novas
on: { workflow_dispatch: {} }
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt openpyxl
      - name: Gerar a seção ONGs com dados reais (sem emendas)
        run: |
          /usr/bin/time -v python -c "from pathlib import Path; from etl import ongs; print(ongs.gerar(None, Path('site')))" 2>&1 | tail -60
          echo "arquivos: $(find site/ongs -type f | wc -l)"; du -sh site/ongs site/ongs/d site/ongs/l
          ls -laS site/ongs/l | head -8; ls -la site/ongs/destaques.json; ls -laS site/ongs/d | head -4
      - name: Amostras
        run: |
          python - <<'P'
          import json, glob
          d = json.load(open("site/ongs/destaques.json")); print(len(d), d[:5])
          for f in sorted(glob.glob("site/ongs/d/*.json")):
              lote = json.load(open(f))
              for c, x in lote.items():
                  if x.get("internacional") and x.get("convenios"):
                      print(json.dumps(x, ensure_ascii=False)[:3000]); break
              else: continue
              break
          P
      - uses: actions/upload-artifact@v4
        with:
          name: ongs-amostra
          path: |
            site/ongs/index.html
            site/ongs/destaques.json
            site/ongs/resumo.json
            site/ongs/l/AC.json
            site/ongs/d/0*.json
