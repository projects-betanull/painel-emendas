name: Sondar fontes novas
on: { workflow_dispatch: {} }
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: PNCP tempos
        run: |
          D1=$(date -d '-364 days' +%Y%m%d); D2=$(date +%Y%m%d)
          B="https://pncp.gov.br/api/consulta/v1/contratos?dataInicial=$D1&dataFinal=$D2"
          for c in 51885242000140 46395000000139 13927801000149 18715383000140; do
            for t in 50 500; do
              curl -s -o p.json -w "$c tam=$t HTTP %{http_code} %{time_total}s %{size_download}B " --max-time 120 "$B&cnpjOrgao=$c&pagina=1&tamanhoPagina=$t"
              jq -c '{totalRegistros,totalPaginas}' p.json 2>/dev/null || echo
            done
          done
          echo "== pagina 2 e 3 SP em paralelo"
          time (curl -s -o /dev/null -w "p2 %{time_total}\n" "$B&cnpjOrgao=46395000000139&pagina=2&tamanhoPagina=500" & curl -s -o /dev/null -w "p3 %{time_total}\n" "$B&cnpjOrgao=46395000000139&pagina=3&tamanhoPagina=500" & wait)
          echo "== site no ar"
          for c in 46395000000139 13927801000149; do curl -s -o s.json -w "site $c HTTP %{http_code} %{time_total}s\n" --max-time 150 "https://painel-emendas.pages.dev/api/contratos?cnpj=$c"; head -c 200 s.json; echo; done
