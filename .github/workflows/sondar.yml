name: Sondar fontes novas
on: { workflow_dispatch: {} }
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Transferegov (convênios e propostas)
        continue-on-error: true
        run: |
          set +e
          for b in http://repositorio.dados.gov.br https://repositorio.dados.gov.br; do
            curl -sL -m 60 -A "Mozilla/5.0" "$b/seges/detru/data_carga_siconv.txt" -w " HTTP %{http_code}\n"
            curl -sL -m 60 -A "Mozilla/5.0" "$b/seges/detru/" -w "\nHTTP %{http_code}\n" | head -c 1500; echo
          done
          curl -sL -m 300 -A "Mozilla/5.0" http://repositorio.dados.gov.br/seges/detru/siconv_proponentes.csv.zip -o pr.zip -w "HTTP %{http_code} %{size_download}\n"; unzip -l pr.zip; unzip -p pr.zip | head -3
          curl -sL -m 600 -A "Mozilla/5.0" http://repositorio.dados.gov.br/seges/detru/siconv_proposta.csv.zip -o p.zip -w "HTTP %{http_code} %{size_download}\n"; unzip -l p.zip; unzip -p p.zip | head -3
          curl -sL -m 600 -A "Mozilla/5.0" http://repositorio.dados.gov.br/seges/detru/siconv_convenio.csv.zip -o c.zip -w "HTTP %{http_code} %{size_download}\n"; unzip -l c.zip; unzip -p c.zip | head -3
      - name: Portal da Transparência (convênios)
        continue-on-error: true
        run: |
          set +e
          for d in 0 1 2 3; do D=$(date -d "-$d days" +%Y%m%d)
            curl -sL -m 600 -A "Mozilla/5.0" "https://portaldatransparencia.gov.br/download-de-dados/convenios/$D" -o cv.zip -w "$D HTTP %{http_code} %{content_type} %{size_download}\n"
            unzip -l cv.zip 2>/dev/null && break; done
          for f in $(unzip -Z1 cv.zip); do echo "== $f"; unzip -p cv.zip "$f" | head -3 | iconv -f latin1 -t utf8; done
      - name: Portal da Transparência (CEPIM)
        continue-on-error: true
        run: |
          D=$(date -d '-3 days' +%Y%m%d)
          curl -sL -A "Mozilla/5.0" "https://portaldatransparencia.gov.br/download-de-dados/cepim/$D" -o cep.zip -w "HTTP %{http_code} %{content_type}\n"; unzip -l cep.zip && unzip -p cep.zip | head -3 | iconv -f latin1 -t utf8
      - name: IATI (d-portal) - Brasil
        continue-on-error: true
        run: |
          curl -s -m 60 "https://d-portal.org/q.json?from=act,country&country_code=BR&limit=2" | head -c 3000; echo
          curl -s -m 60 "https://d-portal.org/q.json?from=act,country&country_code=BR&select=count" | head -c 500; echo
          curl -s -m 60 "https://d-portal.org/q.csv?from=act,country&country_code=BR&limit=3" | head -c 3000; echo
          curl -s -m 60 "https://d-portal.org/q.json?from=trans,country&country_code=BR&limit=2" | head -c 3000; echo
      - name: foreignassistance.gov
        continue-on-error: true
        run: |
          curl -sL -m 60 -A "Mozilla/5.0" https://foreignassistance.gov/data -o f.html -w "HTTP %{http_code}\n"; grep -oiE 'https?://[^"]+\.(csv|zip)' f.html | sort -u | head
          curl -sIL -m 60 https://s3.amazonaws.com/files.explorer.devtechlab.com/us_foreign_aid_complete.csv | grep -iE 'HTTP|length'
