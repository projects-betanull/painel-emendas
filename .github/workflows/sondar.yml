name: Sondar fontes novas
on: { workflow_dispatch: {} }
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir prévia
        run: |
          B=https://previa-pr5-pr6.painel-emendas.pages.dev
          for p in / /parlamento/ /parlamento/parlamento.js /parlamento/dados/indice.json /parlamento/dados/membros.json /parlamento/dados/camara-2026-11.json /parlamento/dados/senado-2026-11.json /ongs/ /ongs/destaques.json /ongs/internacional/ /painel/; do
            curl -s -o /tmp/x -w "%{http_code} %{size_download} %{content_type} $p\n" "$B$p"; done
          curl -s $B/parlamento/dados/indice.json | head -c 300; echo
          curl -s $B/ | grep -o '<nav class="menu">.*</nav>'
