name: ETL diário de emendas

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília, todo dia
  workflow_dispatch: {} # botão "Run workflow" para rodar na mão

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Vazio enquanto o segredo não for criado; o passo de publicação é pulado.
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Vazio enquanto o segredo não for criado; a publicação do site é pulada.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Primeiro ano carregado; o ETL usa tudo o que o Portal tiver a partir daqui.
      ANO_INICIAL: "2000"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Códigos de verificação do Google Search Console e do Bing (Settings → Variables → Actions). Vazios = sem a tag.
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Base de contratos do PNCP (feita pelo workflow pncp.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pncp-dados -p contratos.parquet -D data/pncp || echo "sem base do PNCP; páginas buscam pelo navegador"

      - name: Rodar ETL
        run: python -m etl.build

      - name: Guardar relatório de qualidade
        uses: actions/upload-artifact@v4
        with:
          name: qualidade
          path: data/out/qualidade.json

      - name: Publicar o site e o MCP no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          # Cria o projeto na primeira vez; nas seguintes o comando só avisa que já existe.
          npx --yes wrangler@4 pages project create painel-emendas --production-branch=main || true
          # Segredos das funções (MCP e gestão); só os que existirem no GitHub.
          # TOKEN_SECRET assina os passes; deriva da ADMIN_KEY para não exigir outro segredo.
          jq -n --arg a "$ADMIN_KEY" --arg t "$(printf '%s' "passe-mcp|$ADMIN_KEY" | sha256sum | cut -d' ' -f1)" \
            '{ADMIN_KEY: $a, TOKEN_SECRET: (if $a != "" then $t else "" end)} | with_entries(select(.value != ""))' > /tmp/segredos.json
          if [ "$(jq length /tmp/segredos.json)" -gt 0 ]; then npx --yes wrangler@4 pages secret bulk /tmp/segredos.json --project-name=painel-emendas; fi
          rm -f /tmp/segredos.json
          # A pasta functions/ (MCP em /mcp e /api/gestao) vai junto com o site.
          npx --yes wrangler@4 pages deploy site --project-name=painel-emendas --branch=main --commit-dirty=true

      - name: Publicar no Cloudflare R2
        # Só roda se os segredos do R2 estiverem configurados no repositório.
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 sync data/out "s3://$R2_BUCKET/emendas/" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --cache-control "public, max-age=3600"
